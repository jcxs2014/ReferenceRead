<style>
:root, [data-theme="light"] {
  --bg:#fff; --bg-2:#f6f8fa; --fg:#24292f; --fg-2:#57606a;
  --border:#d0d7de; --accent:#0969da; --accent-fg:#fff;
  --card:#fff; --code-bg:#f6f8fa; --quote-bg:#f6f8fa; --quote-border:#d0d7de;
  --math:#24292f; --search-hl:#fff3b0; --kbd-bg:#e8e8e8;
}
[data-theme="dark"] {
  --bg:#0d1117; --bg-2:#161b22; --fg:#c9d1d9; --fg-2:#8b949e;
  --border:#30363d; --accent:#58a6ff; --accent-fg:#0d1117;
  --card:#161b22; --code-bg:#1c2128; --quote-bg:#1c2128; --quote-border:#30363d;
  --math:#c9d1d9; --search-hl:#9e6a03; --kbd-bg:#21262d;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  font-family:-apple-system,"PingFang SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  font-size:15px; line-height:1.7; color:var(--fg); background:var(--bg);
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}

/* ─── Layout ─── */
.app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }

.toolbar {
  flex-shrink:0; display:flex; align-items:center; gap:8px;
  padding:8px 16px; background:var(--bg-2); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100; flex-wrap:nowrap; overflow:visible;
}
.brand { font-weight:700; font-size:15px; color:var(--accent); white-space:nowrap; flex-shrink:0; }
.brand small { font-weight:400; color:var(--fg-2); margin-left:3px; }

/* Grouped tabs */
.tab-groups { display:flex; gap:6px; align-items:center; flex:1; overflow:visible; flex-shrink:1; }
.tab-group { position:relative; z-index:300; }
.tab-group-btn {
  display:flex; align-items:center; gap:4px;
  padding:5px 12px 5px 12px; border:1px solid var(--border); border-radius:6px;
  background:var(--card); color:var(--fg); font-size:12px; cursor:pointer;
  max-width:200px; flex-shrink:0;
  white-space:nowrap; overflow-x:hidden; text-overflow:ellipsis;
}
.tab-group-btn:hover { border-color:var(--accent); color:var(--accent); }
.tab-group-btn.active { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:600; }
.tab-group-btn::after { content:"▾"; font-size:10px; margin-left:2px; }
.tab-group-btn.active::after { content:"▾ ▴"; }
.tab-dropdown {
  display:none; position:absolute; top:calc(100% + 4px); left:0;
  background:var(--card); border:1px solid var(--border); border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.15); min-width:200px; max-width:320px;
  z-index:200; max-height:60vh; overflow-y:auto; padding:6px;
}
.tab-group.open .tab-dropdown { display:block; }
.tab-dropdown-item {
  display:block; padding:7px 12px; border:0; border-radius:5px;
  background:transparent; color:var(--fg); font-size:13px;
  cursor:pointer; text-decoration:none;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-family:inherit;
}
.tab-dropdown-item:hover { background:var(--bg-2); }
.tab-dropdown-item.active { background:var(--accent); color:var(--accent-fg); font-weight:600; }

/* Back-to-top — stronger dark-mode shadow */
[data-theme="dark"] #btn-top { box-shadow:0 4px 16px rgba(0,0,0,.5); }

/* Dark-mode dropdown — visible border + strong shadow + hover feedback */
[data-theme="dark"] .tab-dropdown {
  border-color:var(--fg-2);
  box-shadow:0 8px 32px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.04);
}
[data-theme="dark"] .tab-dropdown-item:hover { background:#21262d; }

/* Search */
.search-box {
  display:flex; align-items:center; gap:4px;
  padding:5px 10px; border:1px solid var(--border); border-radius:6px;
  background:var(--card); flex-shrink:0; width:200px;
}
.search-box input { border:none; outline:none; background:transparent; color:var(--fg); flex:1; font-size:13px; }
.search-box .count { color:var(--fg-2); font-size:12px; min-width:36px; text-align:right; }

/* Controls */
.controls { display:flex; gap:4px; align-items:center; flex-shrink:0; }
.ctrl-btn {
  padding:5px 9px; border:1px solid var(--border); border-radius:6px;
  background:var(--card); color:var(--fg-2); font-size:12px; cursor:pointer; white-space:nowrap;
}
.ctrl-btn:hover { border-color:var(--accent); color:var(--accent); }
.ctrl-btn.active { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }

/* Overlay — hidden by default, mobile only when sidebar open */
#overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:98; }
@media (max-width:900px) {
  .app.sidebar-open #overlay { display:block; }
}

/* App body — overflow:hidden prevents sidebar scroll capture on desktop */
.app-body { display:flex; flex:1; overflow:hidden; }
.sidebar {
  width:0; flex-shrink:0; overflow:hidden;
  border-right:1px solid var(--border); background:var(--bg-2);
  transition:width .25s; padding:0;
  display:flex; flex-direction:column;
}
.app.sidebar-open .sidebar { width:320px; overflow-y:auto; padding:16px 12px; }
.sidebar h3 { font-size:11px; font-weight:700; color:var(--fg-2); letter-spacing:.04em; margin-bottom:8px; padding:0 4px; }
.toc-item { display:block; padding:5px 8px; font-size:13px; color:var(--fg); text-decoration:none; border-radius:4px; cursor:pointer; border-left:3px solid transparent; }
.toc-item:hover { background:var(--border); }
.toc-item.active { background:rgba(9,105,218,.1); border-left-color:var(--accent); color:var(--accent); font-weight:600; }
.toc-h3 { padding-left:20px; font-size:12px; color:var(--fg-2); }
.toc-h4 { padding-left:32px; font-size:12px; color:var(--fg-2); display:block; }
.toc-h4.toc-h4-collapsed { display:none; }

/* Main */
.main { flex:1; overflow-y:auto; padding:28px 36px; }
.doc-section { display:none; max-width:900px; margin:0 auto; }
.doc-section.active { display:block; }

/* Typography */
.doc-section h2 { font-size:24px; border-bottom:1px solid var(--border); padding-bottom:8px; margin:28px 0 16px; }
.doc-section h2:first-child { margin-top:0; }
.doc-section h3 { font-size:19px; margin:22px 0 12px; }
.doc-section h4 { font-size:16px; font-weight:600; margin:16px 0 10px; }
.doc-section p { margin:8px 0; }
.doc-section ul, .doc-section ol { margin:8px 0 8px 20px; }
.doc-section li { margin:2px 0; }
.doc-section blockquote { margin:12px 0; padding:8px 14px; background:var(--quote-bg); border-left:4px solid var(--quote-border); border-radius:4px; color:var(--fg-2); font-size:14px; }
.doc-section hr { margin:20px 0; border:none; border-top:1px solid var(--border); }
.doc-section code { background:var(--code-bg); padding:1px 6px; border-radius:3px; font-size:13px; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
.doc-section pre { background:var(--code-bg); padding:12px; border-radius:6px; overflow-x:auto; margin:12px 0; }
.doc-section pre code { padding:0; font-size:13px; line-height:1.5; }
.doc-section img { max-width:100%; display:block; margin:12px auto; border-radius:8px; }
.doc-section table { width:100%; border-collapse:collapse; margin:12px 0; font-size:13.5px; }
.doc-section th, .doc-section td { border:1px solid var(--border); padding:7px 12px; text-align:left; vertical-align:top; }
.doc-section th { background:var(--bg-2); font-weight:600; }
.doc-section tbody tr:nth-child(odd) td { background:var(--bg-2); }
.doc-section .doc-table { overflow-x:auto; }
.doc-section input[type="checkbox"] { margin-right:4px; }

/* Math */
.math { color:var(--math); position:relative; }
.math.block-wrap { display:block; margin:10px 0; padding:10px 14px; font-size:15px; text-align:center; overflow-x:auto; max-width:100%; border:1px solid var(--border); border-radius:6px; }
.math.block-wrap .math-inner { white-space:nowrap; }
.math.block-wrap .math-inner .katex { font-size:inherit; }
.copy-btn { display:inline-block; position:absolute; top:5px; right:6px; padding:2px 7px; font-size:11px; cursor:pointer; border:1px solid var(--border); border-radius:4px; background:var(--card); color:var(--fg-2); opacity:.7; transition:opacity .2s; user-select:none; }
.math.block-wrap:hover .copy-btn { opacity:1; }
.copy-btn:hover { border-color:var(--accent); color:var(--accent); }
.copy-btn.copied { color:#2da44e; border-color:#2da44e; }
.math.inline .katex { white-space:normal; }

/* Cards */
.paper-preface { margin:24px 0 16px; padding:12px 18px; background:var(--quote-bg); border-left:4px solid var(--accent); border-radius:4px; }
.paper-preface h3 { margin:0; font-size:18px; color:var(--accent); }
.paper-ref { margin:20px 0; padding:12px 16px; background:var(--card); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:4px; }
.paper-ref h4 { margin-top:0; color:var(--accent); font-size:14px; }
.paper-ref a { color:var(--accent); text-decoration:none; margin-right:12px; }
.paper-ref a:hover { text-decoration:underline; }

/* Footer */
.footer { flex-shrink:0; padding:7px 18px; border-top:1px solid var(--border); background:var(--bg-2); font-size:12px; color:var(--fg-2); display:flex; justify-content:space-between; }
mark.search-hl { background:var(--search-hl); padding:1px 2px; border-radius:2px; color:var(--fg); }

/* Scrollbar */
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--fg-2); }

/* Back to top */
#btn-top {
  display:none; position:fixed; bottom:24px; right:24px;
  width:38px; height:38px; border-radius:50%;
  background:var(--accent); color:var(--accent-fg); border:none;
  font-size:18px; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.2);
  z-index:50; line-height:1; padding-bottom:2px;
}
#btn-top.visible { display:flex; align-items:center; justify-content:center; }

/* Print */
@media print {
  .toolbar, .sidebar, .footer, .controls, #overlay, #btn-top { display:none !important; }
  .app { display:block !important; height:auto !important; overflow:visible !important; }
  .app-body { display:block !important; height:auto !important; overflow:visible !important; }
  .main { overflow:visible !important; height:auto !important; padding:0 !important; max-height:none !important; }
  .doc-section { display:none !important; }
  .doc-section.active { display:block !important; height:auto !important; overflow:visible !important; page-break-after:avoid; }
}

/* Mobile */
@media (max-width:900px) {
  .sidebar {
    position:fixed; top:0; left:0; bottom:0; z-index:99;
    padding-top:50px;
  }
  .app.sidebar-open .sidebar { width:300px; }
  .main { padding:20px 16px; }
  .search-box { width:140px; }
}

/* ── 术语 hover（GLOSS） ─────────────────────────────────────────── */
.gloss {
  border-bottom: 1px dashed var(--accent, #4a6cf7);
  cursor: help;
  text-decoration: none;
}
.gloss:hover {
  background: rgba(74, 108, 247, 0.12);
  border-radius: 2px;
}

/* ── 文献演化谱系树 ─────────────────────────────────────────── */
.evol-box { margin: 1.5rem 0; padding: 1rem 1.2rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-1); }
.evol-box h3 { margin: 0 0 .3rem; font-size: 1.05rem; color: var(--accent); }
.evol-hint { margin: 0 0 .6rem; font-size: .82rem; color: var(--fg-2, #888); }
.evol-tree { list-style: none; padding-left: 0; margin: .4rem 0; }
.evol-tree ul { list-style: none; padding-left: 1.3rem; margin: .15rem 0 .15rem .35rem; border-left: 1px dashed var(--border); }
.evol-branch { cursor: pointer; margin: .18rem 0; }
.evol-toggle { display: inline-block; width: 1.15em; text-align: center; color: var(--fg-2, #888); transition: transform .15s ease; font-size: .85em; }
.evol-branch.open > .evol-toggle { transform: rotate(90deg); }
.evol-branch > .evol-tree { display: none; }
.evol-branch.open > .evol-tree { display: block; }
.evol-label { font-weight: 500; }
.evol-leaf { margin: .12rem 0; }
.evol-leaf a { color: var(--accent); text-decoration: none; cursor: pointer; }
.evol-leaf a:hover { text-decoration: underline; }

<body>
<div class="app" id="app">
  <div id="overlay"></div>

  <div class="toolbar">
    <div class="brand">papers <small>知识库</small></div>
    <div class="tab-groups" id="tabs" role="tablist" aria-label="文档分类"></div>
    <div class="search-box">
      <span>🔍</span>
      <input id="search-input" type="text" placeholder="全文搜索…" spellcheck="false" autocomplete="off" aria-label="搜索文档">
      <span class="count" id="search-count" aria-live="polite" aria-atomic="true"></span>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="btn-toc" title="目录" aria-expanded="false" aria-controls="sidebar" aria-label="打开目录">☰</button>
      <button class="ctrl-btn" id="btn-theme" title="主题" aria-label="切换明暗主题">🌙</button>
      <button class="ctrl-btn" id="btn-print" title="打印" aria-label="打印当前文档">🖨</button>
    </div>
  </div>

  <div class="app-body">
    <aside class="sidebar" id="sidebar" aria-label="目录">
      <div id="toc-container"></div>
    </aside>

      <div id="doc-container"></div>
    </main>

  <button id="btn-top" title="返回顶部">↑</button>

  <div class="footer">
    <span>单文件 · 离线可用 · 断网时公式降级为源码</span>
    <span id="stats"></span>
  </div>
</div>

<script>
const DOCS   = __DOCS_JSON__;
const TOCS   = __TOC_JSON__;
const PAPERS = __PAPERS_JSON__;
const GLOSS  = __GLOSS_JSON__;

const LS = "kb_";

// ── 文献演化谱系树（38 篇，对应 README「文献演化关系」）────────────────
const EVOLUTION_TREE = [
  { label: "01 宇宙线传播", children: [
    { label: "框架基石 · CR 传播综述", children: [
      { label: "Strong, Moskalenko & Ptuskin 2007", slug: "paper-0001_strong-moskalenko-ptuskin-2007" }]},
    { label: "传播参数现代化", children: [
      { label: "Génolini et al. 2021", slug: "paper-0005_genolini-2021" }]},
    { label: "放射性时钟方法线", children: [
      { label: "Mewaldt et al. 2001（Be-10/Al-26/Cl-36 时钟）", slug: "paper-0004_mewaldt-2001-clocks" },
      { label: "Weinrich et al. 2020（AMS-02 约束晕大小）", slug: "paper-0003_weinrich-2020" }]},
    { label: "输运理论综述 → 反馈动力学", children: [
      { label: "Amato & Blasi 2018（CR 输运综述）", slug: "paper-0002_amato-blasi-2018" },
      { label: "Ruszkowski & Pfrommer 2023（星系/星系团反馈）", slug: "paper-0006_ruszkowski-pfrommer-2023" }]},
  ]},
  { label: "02 宇宙线起源与 UHECR", children: [
    { label: "DSA 奠基（1978 双璧）", children: [
      { label: "Bell 1978（平行激波加速）", slug: "paper-0008_bell-1978" },
      { label: "Blandford & Ostriker 1978（扩散激波加速）", slug: "paper-0009_blandford-ostriker-1978" },
      { label: "理论综述：Blandford & Eichler 1987", slug: "paper-0010_blandford-eichler-1987" }]},
    { label: "现代综述与 SNR 应用", children: [
      { label: "Blasi 2013（银河 CR 起源现代综述）", slug: "paper-0004_blasi-2013" },
      { label: "Amato 2014（SNR 伽马射线）", slug: "paper-0005_amato-2014" },
      { label: "Gabici 2019（逃逸与宇宙线海）", slug: "paper-0012_gabici-2019" },
      { label: "Giuffrida 2022（SN 1006 多波段观测）", slug: "paper-0013_giuffrida-2022" }]},
    { label: "判据与全景", children: [
      { label: "Hillas 1984（Hillas 判据）", slug: "paper-0011_hillas-1984" },
      { label: "TA 2023（超 GZK 事件观测）", slug: "paper-0015_telescope-array-2023" },
      { label: "Grenier 2015（银河系内 CR 九命全景）", slug: "paper-0006_grenier-2015" },
      { label: "Gaisser 1990（高能银河 CR 起源）", slug: "paper-0003_gaisser-1990" },
      { label: "Biermann 1996（星系尺度加速与丰度关联）", slug: "paper-0007_biermann-1996" }]},
    { label: "UHECR 链", children: [
      { label: "Bhattacharjee & Sigl 2000（极端能量 CR 综述）", slug: "paper-0001_bhattacharjee-sigl-2000" },
      { label: "Alves Batista 2019（开放问题）", slug: "paper-0014_alvesbatista-2019" },
      { label: "Al-Dargazelli 1996（最高能起源）", slug: "paper-0002_al-dargazelli-1996" }]},
  ]},
  { label: "03 恒星核合成与元素丰度", children: [
    { label: "奠基与综述", children: [
      { label: "B²FH 1957（元素恒星合成）", slug: "paper-0001_b2fh-1957" },
      { label: "Trimble 1975（起源与丰度）", slug: "paper-0002_trimble-1975" },
      { label: "Wallerstein 1997（四十年进展）", slug: "paper-0004_wallerstein-1997" }]},
    { label: "太阳丰度表谱系", children: [
      { label: "Cameron 1968（丰度表奠基）", slug: "paper-0014_cameron-1968" },
      { label: "Anders & Grevesse 1989（陨石+太阳）", slug: "paper-0006_anders-grevesse" },
      { label: "Grevesse & Sauval 1998（标准太阳组成）", slug: "paper-0007_grevesse-sauval-1998" },
      { label: "Asplund 2009（3D 模型）", slug: "paper-0009_asplund-2009-solar-composition" },
      { label: "Lodders 2003（太阳系丰度+凝聚温度）", slug: "paper-0008_lodders-2003" }]},
    { label: "核反应与核天体物理", children: [
      { label: "Champagne & Wiescher 1992（爆炸氢燃烧）", slug: "paper-0005_champagne-wiescher-1992" },
      { label: "Fowler 1984（核天体物理）", slug: "paper-0003_fowler-1984" },
      { label: "Käppeler 2011（s 过程史）", slug: "paper-0017_kaeppeler-2011" }]},
    { label: "恒星观测丰度", children: [
      { label: "Gies & Lambert 1992（B 型星 CNO）", slug: "paper-0010_gies-lambert-1992" },
      { label: "Kraft 1994（球状星团）", slug: "paper-0015_kraft-1994" },
      { label: "Kewley 2001（星暴星系金属丰度）", slug: "paper-0011_kewley-2001-starburst" }]},
    { label: "恒星演化边界与宇宙学核合成", children: [
      { label: "Dieterich 2014（氢燃烧极限）", slug: "paper-0012_dieterich-2014-h-burning-limit" },
      { label: "Bertone & Hooper 2018（含 BBN 的暗物质史）", slug: "paper-0013_bertone-hooper-2018" }]},
    { label: "重元素双通道", children: [
      { label: "Cowan 2021（r 过程现状）", slug: "paper-0016_cowan-2021" },
      { label: "Käppeler 2011（s 过程，与 r 并列）", slug: "paper-0017_kaeppeler-2011" }]},
  ]},
];

function evolTreeHTML(nodes) {
  let h = "<ul class='evol-tree'>";
  nodes.forEach(n => {
    if (n.children && n.children.length) {
      h += `<li class='evol-branch'><span class='evol-toggle'>▸</span><span class='evol-label'>${escapeHtml(n.label)}</span>${evolTreeHTML(n.children)}</li>`;
    } else {
      h += `<li class='evol-leaf'><a href='#' data-slug='${n.slug}'>${escapeHtml(n.label)}</a></li>`;
    }
  });
  return h + "</ul>";
}

function renderEvolutionTree(container) {
  const box = document.createElement("div");
  box.className = "evol-box";
  box.innerHTML = `<h3>📚 文献演化谱系（38 篇）</h3><p class="evol-hint">点击 ▸ 展开谱系分支，点击论文名跳转对应精读页</p>${evolTreeHTML(EVOLUTION_TREE)}`;
  container.appendChild(box);
  box.addEventListener("click", e => {
    const t = e.target.closest(".evol-toggle");
    if (t) {
      const li = t.parentElement;
      const open = li.classList.toggle("open");
      t.textContent = open ? "▾" : "▸";
      return;
    }
    const a = e.target.closest(".evol-leaf a");
    if (a) { e.preventDefault(); switchDoc(a.dataset.slug); }
  });
}

function safeLsGet(k)  { try { return localStorage.getItem(k); } catch { return null; } }
function safeLsSet(k,v){ try { localStorage.setItem(k,v); } catch {} }
function safeLsDel(k)  { try { localStorage.removeItem(k); } catch {} }

let activeSlug   = safeLsGet(LS+"active") || DOCS[0].slug;
const scrollPos = {};

// ── Init ──────────────────────────────────────────────────────────────────
function init() {

// ── Reading progress tracking (localStorage) ────────────────────────────────
const PROGRESS_KEY = "wb_progress_v1"; // v1 = schema version

function getProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}"); }
  catch { return {}; }
}

function saveProgress(progress) {
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
}

function togglePaperStatus(slug) {
  const progress = getProgress();
  progress[slug] = progress[slug] === "completed" ? "reading" : "completed";
  saveProgress(progress);
  renderTabGroups();   // re-render to update checkboxes + stats
  updateStats();
}

function paperStatus(slug) {
  return getProgress()[slug] || "completed";
}

// ── Tab groups (H6 fix: dropdown groups instead of 27 flat tabs) ────────────
function renderTabGroups() {
  const groups = {};
  DOCS.forEach(d => {
    const grp = d.category || "其他";
    if (!groups[grp]) groups[grp] = [];
    groups[grp].push(d);
  });

  const container = document.getElementById("tabs");
  container.innerHTML = "";

  Object.keys(groups).forEach(grpName => {
    const items = groups[grpName];
    const groupDiv = document.createElement("div");
    groupDiv.className = "tab-group";

    const btn = document.createElement("button");
    btn.className = "tab-group-btn";
    btn.dataset.grp = grpName;
    btn.textContent = grpName;
    btn.setAttribute("aria-haspopup", "true");
    btn.setAttribute("aria-expanded", "false");

    const dropdown = document.createElement("div");
    dropdown.className = "tab-dropdown";
    dropdown.setAttribute("role", "menu");

    items.forEach(d => {
      const isPaper = d.slug.startsWith("paper-");
      const status  = isPaper ? paperStatus(d.slug) : "completed";
      const checked = status === "completed";

      const a = document.createElement("button");
      a.className = "tab-dropdown-item" + (d.slug === activeSlug ? " active" : "");
      // Checkbox + title
      a.style.display = "flex";
      a.style.alignItems = "center";
      a.style.gap = "6px";
      a.style.justifyContent = "flex-start";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = checked;
      cb.style.margin = "0";
      cb.style.pointerEvents = "none"; // label handles click
      cb.style.flexShrink = "0";

      const lbl = document.createElement("span");
      lbl.style.flex = "1";
      lbl.style.overflow = "hidden";
      lbl.style.textOverflow = "ellipsis";
      lbl.style.whiteSpace = "nowrap";
      lbl.textContent = d.title;

      a.appendChild(cb);
      a.appendChild(lbl);

      a.dataset.slug = d.slug;
      a.dataset.status = status;
      a.setAttribute("role", "menuitem");
      a.setAttribute("tabindex", "0");
      if (d.slug === activeSlug) a.setAttribute("aria-current", "true");

      a.addEventListener("click", (e) => {
        // Don't navigate if clicking checkbox — handle separately
        if (e.target.tagName === "INPUT") {
          e.stopPropagation();
          togglePaperStatus(d.slug);
          return;
        }
        groupDiv.classList.remove("open");
        btn.setAttribute("aria-expanded", "false");
        switchDoc(d.slug);
      });

      dropdown.appendChild(a);
    });

    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      document.querySelectorAll(".tab-group.open").forEach(g => {
        if (g !== groupDiv) {
          g.classList.remove("open");
          g.querySelector(".tab-group-btn").setAttribute("aria-expanded", "false");
        }
      });
      const isOpen = groupDiv.classList.toggle("open");
      btn.setAttribute("aria-expanded", String(isOpen));
    });

    // Keyboard nav: Arrow keys cycle dropdown items, Esc closes
    btn.addEventListener("keydown", (e) => {
      const items = [...dropdown.querySelectorAll(".tab-dropdown-item")];
      if (!items.length) return;
      const open = groupDiv.classList.contains("open");
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!open) { groupDiv.classList.add("open"); btn.setAttribute("aria-expanded", "true"); }
        else { items[0].focus(); }
      }
    });

    groupDiv.appendChild(btn);
    groupDiv.appendChild(dropdown);
    container.appendChild(groupDiv);
  });

  // Close on outside click
  document.addEventListener("click", () => {
    document.querySelectorAll(".tab-group.open").forEach(g => g.classList.remove("open"));
  });
}

// ── Build / lazy-load doc sections (E2: only current doc in DOM) ───────────
const docCache = {};   // slug -> HTML string

// 术语 hover：把正文中命中 GLOSS 的术语包成 .gloss span（跳过 math/code/pre）
const GLOSS_INDEX = (() => {
  const idx = {};
  (GLOSS || []).forEach(g => {
    const key = g.term.replace(/\s+/g, " ").trim();
    if (key && key.length >= 2 && !idx[key]) idx[key] = g;
  });
  return idx;
})();

function glossForStem(stem) {
  // 该篇术语表：跨篇术语 + papers 含本 stem 的单篇术语
  // stem 形如 paper-0001-strong-...（连字符），glossary.papers 为 0001_strong-...（下划线）
  // 仅把序号后的第一个分隔符换成下划线：0001-strong-... → 0001_strong-...
  const stemNorm = String(stem || "").replace(/^paper-/, "").replace(/^(\d{4})-/, "$1_");
  const list = (GLOSS || []).filter(g =>
    !g.papers.length || g.cross_paper || g.papers.includes(stemNorm));
  return list.sort((a, b) => b.term.length - a.term.length); // 长词优先
}

function injectGloss(root, stem) {
  const items = glossForStem(stem);
  if (!items.length || !root.querySelector) return;
  const SKIP = new Set(["SCRIPT", "STYLE", "CODE", "PRE", "MATH",
                        "SPAN", "A", "BUTTON", "H1", "H2", "H3", "H4"]); // SPAN 防嵌套
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      let el = n.parentElement;
      while (el && el !== root) {
        if (SKIP.has(el.tagName) || el.classList.contains("math")) return NodeFilter.FILTER_REJECT;
        el = el.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const targets = [];
  while (walker.nextNode()) {
    const node = walker.currentNode;
    const text = node.nodeValue || "";
    if (!text.trim()) continue;
    for (const g of items) {
      const term = g.term;
      const i = text.indexOf(term);
      if (i < 0) continue;
      targets.push({ node, term: g.term, def: g.def, papers: g.papers || [] });
      break; // 每文本节点最多包一个术语，防过度嵌套
    }
  }
  // 拆节点包裹（后处理，避免遍历期间改动树）
  targets.forEach(t => {
    const text = t.node.nodeValue || "";
    const i = text.indexOf(t.term);
    if (i < 0) return;
    const span = document.createElement("span");
    span.className = "gloss";
    span.textContent = t.term;
    const tip = `术语：${t.term}` +
      (t.def && t.def !== t.term ? `\n${t.def}` : "") +
      (t.papers.length ? `\n出处：${t.papers.length} 篇论文` : "");
    span.title = tip;
    const frag = document.createDocumentFragment();
    if (i > 0) frag.appendChild(document.createTextNode(text.slice(0, i)));
    frag.appendChild(span);
    frag.appendChild(document.createTextNode(text.slice(i + t.term.length)));
    t.node.parentNode.replaceChild(frag, t.node);
  });
}

// ── 论文引用图谱（O2：citations 驱动，首页渲染）─────────────────────
function renderGraph(container) {
  if (!PAPERS || !PAPERS.length || !container || !container.querySelector) return;
  // 建 stem → paper 映射
  const byStem = {};
  PAPERS.forEach(p => byStem[p.stem] = p);
  // 边：引用（出边 citations）+ 被引（入边，图谱更直观）
  const edges = [];
  PAPERS.forEach(p => {
    (p.citations || []).forEach(c => {
      if (byStem[c]) edges.push({ from: p.stem, to: c });
    });
  });
  // 度数（入+出）
  const deg = {};
  PAPERS.forEach(p => deg[p.stem] = 0);
  edges.forEach(e => { deg[e.from]++; deg[e.to]++; });
  // 简单力导向布局（斥力 + 弹簧，80 轮）
  const pos = {};
  PAPERS.forEach((p, i) => {
    const ang = (i / PAPERS.length) * Math.PI * 2;
    pos[p.stem] = { x: 240 + Math.cos(ang) * 190, y: 180 + Math.sin(ang) * 150 };
  });
  const cx = 240, cy = 180;
  for (let iter = 0; iter < 80; iter++) {
    // 斥力
    for (let i = 0; i < PAPERS.length; i++) {
      for (let j = i + 1; j < PAPERS.length; j++) {
        const a = pos[PAPERS[i].stem], b = pos[PAPERS[j].stem];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.sqrt(dx * dx + dy * dy) || 1;
        const force = 2600 / (d * d);
        dx /= d; dy /= d;
        a.x -= dx * force; a.y -= dy * force;
        b.x += dx * force; b.y += dy * force;
      }
    }
    // 弹簧（引用边拉近）
    edges.forEach(e => {
      const a = pos[e.from], b = pos[e.to];
      if (!a || !b) return;
      let dx = b.x - a.x, dy = b.y - a.y;
      let d = Math.sqrt(dx * dx + dy * dy) || 1;
      const force = (d - 90) * 0.06;
      dx /= d; dy /= d;
      a.x += dx * force; a.y += dy * force;
      b.x -= dx * force; b.y -= dy * force;
    });
    // 引力（向中心，防飞散）
    PAPERS.forEach(p => {
      const v = pos[p.stem];
      v.x += (cx - v.x) * 0.008;
      v.y += (cy - v.y) * 0.008;
    });
  }
  // 渲染 SVG
  const W = 520, H = 380;
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:560px;background:rgba(255,255,255,0.03);border:1px solid var(--fg-3, #333);border-radius:8px" role="img" aria-label="论文引用图谱">`;
  edges.forEach(e => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    svg += `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="var(--fg-3, #888)" stroke-width="1" stroke-opacity="0.5"/>`;
  });
  PAPERS.forEach(p => {
    const v = pos[p.stem];
    if (!v) return;
    const r = 6 + Math.min(8, deg[p.stem] * 2.5);
    svg += `<g class="graph-node" data-slug="${p.slug}" style="cursor:pointer" title="${p.label}">
      <circle cx="${v.x.toFixed(1)}" cy="${v.y.toFixed(1)}" r="${r}" fill="var(--accent, #4a6cf7)" fill-opacity="0.8" stroke="var(--bg, #111)" stroke-width="1.5"/>
      <text x="${(v.x + r + 4).toFixed(1)}" y="${(v.y + 4).toFixed(1)}" font-size="9" fill="var(--fg, #ddd)">${p.label.replace(/&/g, "&amp;").length > 22 ? p.label.replace(/&/g, "&amp;").slice(0, 21) + "…" : p.label.replace(/&/g, "&amp;")}</text>
    </g>`;
  });
  svg += `</svg><p style="color:var(--fg-2,#999);font-size:12px;margin:6px 0 0">节点大小 = 引用度数；边 = 库内引用（citations）。点击节点跳转论文。</p>`;
  const box = document.createElement("div");
  box.className = "graph-box";
  box.style.margin = "18px 0";
  box.innerHTML = `<h3 style="margin:0 0 8px">📈 论文引用图谱（21 篇 · ${edges.length} 条库内引用）</h3>` + svg;
  container.appendChild(box);
  // 点击跳转
  box.querySelectorAll(".graph-node").forEach(n => {
    n.addEventListener("click", () => {
      const slug = n.dataset.slug;
      if (slug && typeof switchDoc === "function") switchDoc(slug);
      else if (slug) location.hash = "#" + slug;
    });
  });
}

function buildDocs() {
  const active = DOCS.find(d => d.slug === activeSlug) || DOCS[0];
  const container = document.getElementById("doc-container");
  container.innerHTML = `<section class="doc-section" data-slug="${active.slug}">${active.html}</section>`;
  injectGloss(container.querySelector("section[data-slug]"), active.slug);
  // 首页渲染引用图谱（打开即见全局论文关系）
  const sec = container.querySelector("section[data-slug]");
  if (sec && active.slug === "知识库首页") {
    renderGraph(sec);
    renderEvolutionTree(sec);
  }
  // Pre-cache all other docs in memory (E2: fast subsequent switches)
  DOCS.forEach(d => { if (d.slug !== active.slug && !(d.slug in docCache)) docCache[d.slug] = d.html; });
}

function ensureDoc(slug) {
  // Ensure slug's section exists in DOM; load from cache or DOCS
  if (document.querySelector(`section[data-slug="${slug}"]`)) return;
  const html = docCache[slug] || (() => {
    const d = DOCS.find(x => x.slug === slug);
    return d ? d.html : "";
  })();
  const container = document.getElementById("doc-container");
  container.insertAdjacentHTML("beforeend", `<section class="doc-section" data-slug="${slug}">${html}</section>`);
  injectGloss(container.querySelector(`section[data-slug="${slug}"]`), slug);
  docCache[slug] = html;  // already in mem from buildDocs pre-cache
}

// ── TOC render ──────────────────────────────────────────────────────────────
function renderTOC(slug) {
  const tocDiv = document.getElementById("toc-container");
  if (!tocDiv) return;
  const items = TOCS.filter(t => t.parent_id === slug && t.level <= 4);
  if (!items.length) {
    tocDiv.innerHTML = '<h3>目录</h3><p style="color:var(--fg-2);font-size:13px;padding:0 4px">无目录</p>';
    return;
  }

  // Assign each h4 its nearest preceding h2/h3 as parent
  const parentMap = {};   // h4_id -> parent h2/h3 id
  let lastH23Id = null;
  for (const it of items) {
    if (it.level <= 3) lastH23Id = it.id;
    else parentMap[it.id] = lastH23Id;
  }

  const htmlParts = ['<h3>目录</h3>'];
  let h4Buffer = [];

  for (const it of items) {
    if (it.level <= 3) {
      if (h4Buffer.length) {
        htmlParts.push(`<div class="toc-h4-group">${h4Buffer.join("")}</div>`);
        h4Buffer = [];
      }
      const cls = it.level === 2 ? "toc-item" : "toc-item toc-h3";
      htmlParts.push(`<div class="${cls}" data-id="${it.id}">${escapeHtml(it.title)}</div>`);
    } else {
      h4Buffer.push(`<div class="toc-item toc-h4" data-id="${it.id}" data-parent-id="${parentMap[it.id]}">${escapeHtml(it.title)}</div>`);
    }
  }
  if (h4Buffer.length) {
    htmlParts.push(`<div class="toc-h4-group">${h4Buffer.join("")}</div>`);
  }

  tocDiv.innerHTML = htmlParts.join("");

  // Click h2/h3 → toggle its h4 children; click h4 → scroll to heading
  tocDiv.querySelectorAll(".toc-item").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if (el.dataset.parentId) {
        // h4: scroll to heading
        const target = document.getElementById(el.dataset.id);
        if (target) target.scrollIntoView({behavior:"smooth", block:"start"});
      } else {
        // h2/h3: toggle h4 group
        const h4s = tocDiv.querySelectorAll(`.toc-h4[data-parent-id="${el.dataset.id}"]`);
        h4s.forEach(h4 => h4.classList.toggle("toc-h4-collapsed"));
      }
    });
  });
}

function closeSidebar() {
  document.getElementById("app").classList.remove("sidebar-open");
  document.getElementById("btn-toc").classList.remove("active");
  document.getElementById("btn-toc").setAttribute("aria-expanded", "false");
}

// ── Switch doc ─────────────────────────────────────────────────────────────
function switchDoc(slug) {
  activeSlug = slug;
  safeLsSet(LS+"active", slug);

  // E2: lazy-load this doc's section if not in DOM
  ensureDoc(slug);

  // Update tab group buttons: show group name (never doc title)
  document.querySelectorAll(".tab-group-btn").forEach(b => {
    const isActive = b.dataset.grp === getDoc(slug).category;
    b.classList.toggle("active", isActive);
    b.textContent = b.dataset.grp;
  });
  document.querySelectorAll(".tab-dropdown-item").forEach(a => {
    a.classList.toggle("active", a.dataset.slug === slug);
  });

  // Show correct section (all sections always in DOM via ensureDoc)
  document.querySelectorAll(".doc-section").forEach(s => {
    s.classList.toggle("active", s.dataset.slug === slug);
  });

  renderTOC(slug);
  const main = document.getElementById("main");
  if (scrollPos[slug] !== undefined) main.scrollTop = scrollPos[slug];
  else main.scrollTop = 0;

  applyMath();
  // Close sidebar on mobile after switching
  if (window.innerWidth <= 900) closeSidebar();
}

function getDoc(slug) {
  return DOCS.find(d => d.slug === slug) || DOCS[0];
}

// ── Escape HTML ────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Search ─────────────────────────────────────────────────────────────────
// ── Full-text search via inverted index ────────────────────────────────────
// SEARCH_INDEX: { term -> [{slug, section, path}][] }
// Replaces live-DOM walk with pre-built index — searches across ALL docs,
// including those not yet loaded.
const SEARCH_INDEX = __SEARCH_INDEX_JSON__; // {index: {term: entries[]}, count, total_entries}

function _buildSearchMap() {
  if (!SEARCH_INDEX || !SEARCH_INDEX.index) return null;
  const termMap = new Map();
  for (const [term, entries] of Object.entries(SEARCH_INDEX.index)) {
    if (entries && entries.length) termMap.set(term, entries);
  }
  return termMap;
}
const _searchTermMap = _buildSearchMap();

function doSearch(query) {
  const count = document.getElementById("search-count");
  // Remove old highlights in DOM
  document.querySelectorAll("mark.search-hl").forEach(m => m.replaceWith(m.textContent));

  const q = (query || "").trim();
  if (!q) { count.textContent = ""; return; }

  // Try index first (pre-built, cross-doc)
  if (_searchTermMap && _searchTermMap.has(q.toLowerCase())) {
    const entries = _searchTermMap.get(q.toLowerCase());
    count.textContent = `${entries.length} 命中（${_sectionNames(entries)}）`;
    return;
  }

  // Fallback: live DOM walk for multi-word / fuzzy
  const re = new RegExp(escapeRegex(q), "gi");
  let total = 0;
  document.querySelectorAll(".doc-section").forEach(sec => {
    const nodes = [];
    const walker = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT, null, false);
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(textNode => {
      const parent = textNode.parentElement;
      if (parent && (parent.closest(".katex") || parent.closest(".math"))) return;
      if (re.test(textNode.textContent)) {
        re.lastIndex = 0;
        const frag = document.createDocumentFragment();
        const parts = textNode.textContent.split(re);
        re.lastIndex = 0;
        for (let i = 0; i < parts.length; i++) {
          if (parts[i]) frag.appendChild(document.createTextNode(parts[i]));
          if (i < parts.length - 1) {
            total++;
            const m = document.createElement("mark");
            m.className = "search-hl";
            m.textContent = q;
            frag.appendChild(m);
          }
        }
        textNode.parentNode.replaceChild(frag, textNode);
      }
    });
  });
  count.textContent = total ? `${total} 命中` : "无";
  if (total > 0) {
    const first = document.querySelector("mark.search-hl");
    if (first) first.scrollIntoView({behavior:"smooth", block:"center"});
  }
}

function _sectionNames(entries) {
  const seen = new Map();
  for (const e of entries) {
    const sec = e.section || "(root)";
    if (!seen.has(sec)) seen.set(sec, 0);
    seen.set(sec, seen.get(sec) + 1);
  }
  const parts = [...seen.entries()].map(([s, n]) => `${s}${n > 1 ? ` ×${n}` : ""}`);
  return parts.slice(0, 3).join(", ") + (parts.length > 3 ? ` +${parts.length - 3}` : "");
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

// ── Theme ──────────────────────────────────────────────────────────────────
function applyTheme() {
  const t = safeLsGet(LS+"theme") || "light";
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("btn-theme").textContent = t === "dark" ? "☀️" : "🌙";
}
document.getElementById("btn-theme").addEventListener("click", () => {
  const cur  = document.documentElement.getAttribute("data-theme") || "light";
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  safeLsSet(LS+"theme", next);
  document.getElementById("btn-theme").textContent = next === "dark" ? "☀️" : "🌙";
});

// ── Scroll tracking + active TOC item ─────────────────────────────────────
document.getElementById("main").addEventListener("scroll", () => {
  const main  = document.getElementById("main");
  const slug  = activeSlug;
  scrollPos[slug] = main.scrollTop;

  const sec = document.querySelector(`section[data-slug="${slug}"]`);
  if (!sec) return;
  let cur = null;
  sec.querySelectorAll("h2,h3,h4").forEach(h => {
    if (h.getBoundingClientRect().top - main.getBoundingClientRect().top < 120) cur = h;
  });
  document.querySelectorAll(".toc-item").forEach(a => a.classList.remove("active"));
  if (cur) {
    const a = document.querySelector(`.toc-item[data-id="${cur.id}"]`);
    if (a) a.classList.add("active");
  }

  // Back-to-top button visibility
  document.getElementById("btn-top").classList.toggle("visible", main.scrollTop > 600);
});
document.getElementById("btn-top").addEventListener("click", () => {
  document.getElementById("main").scrollTo({top:0, behavior:"smooth"});
});

// ── Math rendering (H2 fix: data-processed guard for inline) ───────────────
function applyMath() {
  if (!window.katex) return;
  const sec = document.querySelector(`section[data-slug="${activeSlug}"]`);
  if (!sec) return;

  // Inline: guard with data-processed
  sec.querySelectorAll(".math.inline").forEach(el => {
    if (el.dataset.processed) return;
    el.dataset.processed = "1";
    try { katex.render(el.textContent, el, {throwOnError:false, displayMode:false}); }
    catch(e) { el.style.fontFamily = "monospace"; }
  });

  // Block: guard with data-processed; add copy button only once
  sec.querySelectorAll(".math.block-wrap").forEach(wrap => {
    if (wrap.dataset.processed) return;
    wrap.dataset.processed = "1";
    const inner = wrap.querySelector(".math-inner");
    const src   = inner.textContent;
    // Add copy button only if not already present (avoids double-add on re-render)
    if (!wrap.querySelector(".copy-btn")) {
      const btn   = document.createElement("button");
      btn.className = "copy-btn";
      btn.textContent = "📋 LaTeX";
      btn.title = "复制 LaTeX 源码";
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(src).then(
          () => { btn.textContent="✓"; btn.classList.add("copied"); setTimeout(()=>{btn.textContent="📋 LaTeX";btn.classList.remove("copied");},1500); },
          () => { const t=document.createElement("textarea"); t.value=src; document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t); btn.textContent="✓"; setTimeout(()=>btn.textContent="📋 LaTeX",1500); }
        );
      });
      wrap.appendChild(btn);
    }
    try { katex.render(src, inner, {throwOnError:false, displayMode:true}); }
    catch(e) { inner.style.fontFamily = "monospace"; }
  });
}

// ── Stats (M7 fix: dynamic from DOCS/PAPERS/TOCS) ─────────────────────────
function updateStats() {
  const bgDocs   = DOCS.filter(d => d.category === "背景知识").length;
  const papers   = PAPERS.length;
  const tocTerms = new Set(TOCS.map(t => t.title)).size;
  const progress = getProgress();
  const completed = PAPERS.filter(p => progress[p.slug] === "completed").length;
  const reading  = PAPERS.length - completed;
  document.getElementById("stats").textContent =
    reading > 0
      ? `${bgDocs} 篇知识库 · 已读 ${completed}/${papers} 篇 · ${tocTerms} 目录项`
      : `${bgDocs} 篇知识库 · ${papers} 篇论文 · ${tocTerms} 目录项`;
}

// ── Keyboard shortcuts ──────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "/") {
    e.preventDefault();
    document.getElementById("search-input").focus();
  }
  if (e.key === "Escape") {
    document.getElementById("search-input").value = "";
    doSearch("");
    e.target.blur();
    document.querySelectorAll(".tab-group.open").forEach(g => g.classList.remove("open"));
  }
  if (e.key === "t" || e.key === "T") {
    document.getElementById("btn-theme").click();
  }
});

// ── Event listeners ────────────────────────────────────────────────────────
document.getElementById("search-input").addEventListener("input", e => doSearch(e.target.value));
document.getElementById("search-input").addEventListener("keydown", e => {
  if (e.key === "Escape") { e.target.value = ""; doSearch(""); e.target.blur(); }
});

document.getElementById("btn-toc").addEventListener("click", () => {
  const app = document.getElementById("app");
  const open = app.classList.toggle("sidebar-open");
  document.getElementById("btn-toc").classList.toggle("active", open);
  document.getElementById("btn-toc").setAttribute("aria-expanded", String(open));
});
document.getElementById("overlay").addEventListener("click", closeSidebar);
document.getElementById("btn-print").addEventListener("click", () => window.print());

// ── Start ───────────────────────────────────────────────────────────────────
init();
// KaTeX is deferred — it may load before or after DOMContentLoaded fires.
// Check immediately (if DOM already ready) and again when DOMContentLoaded fires.
if (document.readyState !== "loading" && window.katex) applyMath();
document.addEventListener("DOMContentLoaded", () => {
  if (window.katex) applyMath();
});
</script>
