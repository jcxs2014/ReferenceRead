<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>papers 知识库 · 交互版</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
:root, [data-theme="light"] {
  --bg:#fff; --bg-2:#f6f8fa; --fg:#24292f; --fg-2:#57606a;
  --border:#d0d7de; --accent:#0969da; --accent-fg:#fff;
  --card:#fff; --code-bg:#f6f8fa; --quote-bg:#f6f8fa; --quote-border:#d0d7de;
  --math:#24292f; --search-hl:#fff3b0;
}
[data-theme="dark"] {
  --bg:#0d1117; --bg-2:#161b22; --fg:#c9d1d9; --fg-2:#8b949e;
  --border:#30363d; --accent:#58a6ff; --accent-fg:#0d1117;
  --card:#161b22; --code-bg:#1c2128; --quote-bg:#1c2128; --quote-border:#30363d;
  --math:#c9d1d9; --search-hl:#b88300;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  font-family:-apple-system,"PingFang SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  font-size:15px; line-height:1.7; color:var(--fg); background:var(--bg);
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}

/* ─── Layout ─── */
.app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
.toolbar {
  flex-shrink:0; display:flex; align-items:center; gap:12px;
  padding:10px 18px; background:var(--bg-2); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100; flex-wrap:wrap;
}
.brand { font-weight:700; font-size:16px; color:var(--accent); white-space:nowrap; }
.brand small { font-weight:400; color:var(--fg-2); margin-left:4px; }
.tabs { display:flex; gap:4px; flex-wrap:wrap; }
.tab-btn {
  padding:6px 14px; border:1px solid var(--border); border-radius:6px;
  background:var(--card); color:var(--fg); font-size:13px; cursor:pointer;
  transition:all .15s; white-space:nowrap;
}
.tab-btn:hover { border-color:var(--accent); }
.tab-btn.active { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:600; }
.search-box {
  display:flex; align-items:center; gap:4px;
  padding:5px 10px; border:1px solid var(--border); border-radius:6px;
  background:var(--card); flex:1; min-width:180px; max-width:360px;
}
.search-box input { border:none; outline:none; background:transparent; color:var(--fg); flex:1; font-size:13px; }
.search-box .count { color:var(--fg-2); font-size:12px; min-width:40px; text-align:right; }
.controls { display:flex; gap:6px; align-items:center; margin-left:auto; }
.ctrl-btn {
  padding:5px 10px; border:1px solid var(--border); border-radius:6px;
  background:var(--card); color:var(--fg-2); font-size:13px; cursor:pointer;
}
.ctrl-btn:hover { border-color:var(--accent); color:var(--accent); }
.ctrl-btn.active { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }

.app-body { display:flex; flex:1; overflow:hidden; }

/* Sidebar */
.sidebar {
  width:0; flex-shrink:0; overflow-y:auto; overflow-x:hidden;
  border-right:1px solid var(--border); background:var(--bg-2);
  transition:width .25s; padding:16px 12px;
}
.app.sidebar-open .sidebar { width:320px; }
.sidebar h3 { font-size:12px; font-weight:700; color:var(--fg-2); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
.toc-item { display:block; padding:4px 8px; font-size:13px; color:var(--fg); text-decoration:none; border-radius:4px; cursor:pointer; }
.toc-item:hover { background:var(--border); }
.toc-item.active { background:var(--accent); color:var(--accent-fg); font-weight:600; }
.toc-h3 { padding-left:20px; font-size:12px; color:var(--fg-2); }
.toc-h4 { padding-left:32px; font-size:12px; color:var(--fg-2); }

.main { flex:1; overflow-y:auto; padding:24px 32px; }
.doc-section { display:none; max-width:900px; margin:0 auto; }
.doc-section.active { display:block; }
.doc-section h2 { font-size:22px; border-bottom:1px solid var(--border); padding-bottom:8px; margin:24px 0 16px; color:var(--fg); }
.doc-section h2:first-child { margin-top:0; }
.doc-section h3 { font-size:18px; margin:20px 0 12px; color:var(--fg); }
.doc-section h4 { font-size:15px; margin:16px 0 10px; color:var(--fg-2); }
.doc-section p { margin:8px 0; }
.doc-section ul, .doc-section ol { margin:8px 0 8px 20px; }
.doc-section li { margin:2px 0; }
.doc-section blockquote { margin:12px 0; padding:8px 14px; background:var(--quote-bg); border-left:4px solid var(--accent); border-radius:4px; color:var(--fg-2); font-size:14px; }
.doc-section hr { margin:20px 0; border:none; border-top:1px solid var(--border); }
.doc-section code { background:var(--code-bg); padding:1px 6px; border-radius:3px; font-size:13px; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
.doc-section pre { background:var(--code-bg); padding:12px; border-radius:6px; overflow-x:auto; margin:12px 0; }
.doc-section pre code { padding:0; font-size:13px; line-height:1.5; }
.doc-section img { max-width:100%; }
.doc-section table { width:100%; border-collapse:collapse; margin:12px 0; font-size:13px; }
.doc-section th, .doc-section td { border:1px solid var(--border); padding:6px 10px; text-align:left; vertical-align:top; }
.doc-section th { background:var(--bg-2); font-weight:600; }
.doc-section .doc-table { overflow-x:auto; }
.doc-section input[type="checkbox"] { margin-right:4px; }

.math { color:var(--math); position:relative; }
.math.block-wrap { display:block; margin:10px 0; padding:8px 12px; font-size:15px; text-align:center; overflow-x:auto; max-width:100%; border:1px solid var(--border); border-radius:6px; background:var(--code-bg); }
.math.block-wrap .math-inner { white-space:nowrap; }
.math.block-wrap .math-inner .katex { font-size:inherit; }
.copy-btn { display:inline-block; position:absolute; top:4px; right:6px; padding:2px 6px; font-size:11px; cursor:pointer; border:1px solid var(--border); border-radius:4px; background:var(--card); color:var(--fg-2); opacity:.4; transition:opacity .2s; user-select:none; }
.math.block-wrap:hover .copy-btn { opacity:1; }
.copy-btn:hover { border-color:var(--accent); color:var(--accent); }
.copy-btn.copied { color:#2da44e; border-color:#2da44e; }
.math.inline .katex { white-space:normal; }

.paper-preface { margin:28px 0 16px; padding:12px 18px; background:var(--quote-bg); border-left:4px solid var(--accent); border-radius:4px; }
.paper-preface h3 { margin:0; font-size:18px; color:var(--accent); }
.paper-preface h3::before { content:"📄 "; }
.paper-ref { margin:20px 0; padding:12px 16px; background:var(--quote-bg); border-left:4px solid var(--accent); border-radius:4px; }
.paper-ref h4 { margin-top:0; color:var(--accent); }
.paper-ref a { color:var(--accent); text-decoration:none; }
.paper-ref a:hover { text-decoration:underline; }

.footer { flex-shrink:0; padding:8px 20px; border-top:1px solid var(--border); background:var(--bg-2); font-size:12px; color:var(--fg-2); display:flex; justify-content:space-between; }

mark.search-hl { background:var(--search-hl); padding:1px 2px; border-radius:2px; }

@media print {
  .toolbar, .sidebar, .footer, .controls { display:none !important; }
  .app { display:block; }
  .app-body { display:block; }
  .main { overflow:visible; height:auto; }
  .doc-section { display:block !important; page-break-before:always; }
  .doc-section:first-of-type { page-break-before:avoid; }
}
@media (max-width:900px) {
  .sidebar { position:fixed; top:50px; left:0; bottom:36px; z-index:99; }
  .app.sidebar-open .sidebar { width:300px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="brand">papers <small>知识库</small></div>
    <div class="tabs" id="tabs"></div>
    <div class="search-box">
      <span>🔍</span>
      <input id="search-input" type="text" placeholder="全文搜索…" spellcheck="false">
      <span class="count" id="search-count"></span>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="btn-toc" title="目录">☰ 目录</button>
      <button class="ctrl-btn" id="btn-theme" title="主题">🌙</button>
      <button class="ctrl-btn" id="btn-print" title="打印">🖨</button>
    </div>
  </div>

  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <div id="toc-container"></div>
    </aside>
    <main class="main" id="main">
      <div id="doc-container"></div>
    </main>
  </div>

  <div class="footer">
    <span>单文件 · 离线可用 · 断网时公式降级为源码</span>
    <span id="stats"></span>
  </div>
</div>

<script>
const DOCS = __DOCS_JSON__;
const TOCS = __TOC_JSON__;
const PAPERS = __PAPERS_JSON__;

const LS = "kb_";
let activeSlug = localStorage.getItem(LS+"active") || DOCS[0].slug;
const scrollPos = {};

function init() {
  renderTabs();
  buildDocs();
  switchDoc(activeSlug);
  applyTheme();
  renderPaperRef();
  applyMath();
  updateStats();
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = DOCS.map(d =>
    `<button class="tab-btn${d.slug===activeSlug?' active':''}" data-slug="${d.slug}">${d.title}</button>`
  ).join("");
  tabs.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => switchDoc(btn.dataset.slug));
  });
}

function buildDocs() {
  const container = document.getElementById("doc-container");
  container.innerHTML = DOCS.map(d => {
    const html = decodeBase64(d.b64 || d.body_b64);
    return `<section class="doc-section" data-slug="${d.slug}">${html}</section>`;
  }).join("");
}

function renderTOC(slug) {
  const tocDiv = document.getElementById("toc-container");
  if (!tocDiv) return;
  // TOCS is a flat array; each item has parent_id (the doc slug). Group on the fly.
  const items = TOCS.filter(t => t.parent_id === slug);
  if (!items.length) { tocDiv.innerHTML = '<h3>目录</h3><p style="color:var(--fg-2);font-size:13px;">无目录</p>'; return; }
  tocDiv.innerHTML = '<h3>目录</h3>' +
    items.map(it => {
      const cls = it.level===2 ? "toc-item" : it.level===3 ? "toc-item toc-h3" : "toc-item toc-h4";
      return `<a class="${cls}" data-id="${it.id}">${escapeHtml(it.title)}</a>`;
    }).join("");
  tocDiv.querySelectorAll(".toc-item").forEach(a => {
    a.addEventListener("click", () => {
      const sec = document.getElementById("doc-" + a.dataset.id);
      if (sec) sec.scrollIntoView({behavior:"smooth",block:"start"});
    });
  });
}

function switchDoc(slug) {
  activeSlug = slug;
  localStorage.setItem(LS+"active", slug);
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.slug===slug));
  document.querySelectorAll(".doc-section").forEach(s => s.classList.toggle("active", s.dataset.slug===slug));
  renderTOC(slug);
  const main = document.getElementById("main");
  if (scrollPos[slug] !== undefined) main.scrollTop = scrollPos[slug];
  else main.scrollTop = 0;
  applyMath();
}

function decodeBase64(s) {
  return decodeURIComponent(atob(s).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
}
function escapeHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function doSearch(query) {
  const count = document.getElementById("search-count");
  document.querySelectorAll("mark.search-hl").forEach(m => m.replaceWith(m.textContent));
  if (!query || query.trim().length<1) { count.textContent=""; return; }
  const re = new RegExp(escapeRegex(query.trim()), "gi");
  const sec = document.querySelector(`section[data-slug="${activeSlug}"]`);
  if (!sec) return;
  let total = 0;
  const walk = (node) => {
    Array.from(node.childNodes).forEach(child => {
      if (child.nodeType===3 && re.test(child.textContent)) {
        const frag = document.createDocumentFragment();
        const parts = child.textContent.split(re);
        for (let i=0;i<parts.length;i++) {
          if (parts[i]) frag.appendChild(document.createTextNode(parts[i]));
          if (i<parts.length-1) { total++; const m=document.createElement("mark"); m.className="search-hl"; m.textContent=query.trim(); frag.appendChild(m); }
        }
        node.replaceChild(frag, child);
      } else if (child.nodeType===1 && child.tagName!=="SCRIPT" && child.tagName!=="STYLE") {
        walk(child);
      }
    });
  };
  walk(sec);
  count.textContent = total ? `${total} 命中` : "无";
  if (total>0) { const f=sec.querySelector("mark.search-hl"); if(f) f.scrollIntoView({behavior:"smooth",block:"center"}); }
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }

function applyTheme() {
  const t = localStorage.getItem(LS+"theme") || "light";
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("btn-theme").textContent = t==="dark" ? "☀️" : "🌙";
}
document.getElementById("btn-theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  const next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(LS+"theme", next);
  document.getElementById("btn-theme").textContent = next==="dark" ? "☀️" : "🌙";
});

document.getElementById("main").addEventListener("scroll", () => {
  scrollPos[activeSlug] = document.getElementById("main").scrollTop;
  const sec = document.querySelector(`section[data-slug="${activeSlug}"]`);
  if (!sec) return;
  let cur = null;
  sec.querySelectorAll("h2,h3,h4").forEach(h => {
    if (h.getBoundingClientRect().top - document.getElementById("main").getBoundingClientRect().top < 120) cur = h;
  });
  document.querySelectorAll(".toc-item").forEach(a => a.classList.remove("active"));
  if (cur) { const a = document.querySelector(`.toc-item[data-id="${cur.id}"]`); if(a) a.classList.add("active"); }
});

function applyMath() {
  if (!window.katex) return;
  const sec = document.querySelector(`section[data-slug="${activeSlug}"]`);
  if (!sec) return;
  sec.querySelectorAll(".math.inline").forEach(el => {
    try { katex.render(el.textContent, el, {throwOnError:false, displayMode:false}); }
    catch(e) { el.style.fontFamily="monospace"; }
  });
  sec.querySelectorAll(".math.block-wrap").forEach(wrap => {
    if (wrap.dataset.processed) return;
    wrap.dataset.processed = "1";
    const inner = wrap.querySelector(".math-inner");
    const src = inner.textContent;
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.textContent = "📋 LaTeX";
    btn.title = "复制 LaTeX 源码";
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(src).then(() => {
        btn.textContent="✓ Copied"; btn.classList.add("copied");
        setTimeout(() => { btn.textContent="📋 LaTeX"; btn.classList.remove("copied"); }, 1500);
      }).catch(() => {
        const ta=document.createElement("textarea"); ta.value=src; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        btn.textContent="✓ Copied"; setTimeout(() => btn.textContent="📋 LaTeX", 1500);
      });
    });
    wrap.appendChild(btn);
    try { katex.render(src, inner, {throwOnError:false, displayMode:true}); }
    catch(e) { inner.style.fontFamily="monospace"; }
  });
}

function updateStats() {
  const totalChars = DOCS.reduce((s,d) => s + (d.size||0), 0);
  document.getElementById("stats").textContent =
    `3 篇知识库 · 21 篇论文 · 664 术语 · HTML ${Math.round(totalChars/1024)} KB`;
}

document.getElementById("search-input").addEventListener("input", e => doSearch(e.target.value));
document.getElementById("search-input").addEventListener("keydown", e => {
  if (e.key==="Escape") { e.target.value=""; doSearch(""); e.target.blur(); }
});
document.getElementById("btn-toc").addEventListener("click", () => {
  const app = document.querySelector(".app");
  app.classList.toggle("sidebar-open");
  document.getElementById("btn-toc").classList.toggle("active");
});
document.getElementById("btn-print").addEventListener("click", () => window.print());

// Paper cross-references: link paper mentions in rendered content
function renderPaperRef() {
  DOCS.forEach(d => {
    const sec = document.querySelector(`section[data-slug="${d.slug}"]`);
    if (!sec || !sec.textContent) return;
    const text = sec.textContent;
    const mentioned = PAPERS.filter(p => {
      const m = p.label.match(/\((\d{4})\)/);
      if (!m) return false;
      return text.includes(m[1]);
    });
    if (mentioned.length===0) return;
    const seen=new Set(), unique=[];
    for (const p of mentioned) { if(seen.has(p.dir)) continue; seen.add(p.dir); unique.push(p); }
    if (unique.length===0) return;
    const div = document.createElement("div");
    div.className = "paper-ref";
    div.innerHTML = `<h4>📄 本章涉及论文（${unique.length} 篇）</h4>` +
      unique.map(p => `<a href="#" data-pref-slug="${p.slug}">${p.label}</a>`).join(" · ");
    sec.appendChild(div);
    div.querySelectorAll("a").forEach(a => {
      a.addEventListener("click", (e) => { e.preventDefault(); switchDoc(a.dataset.prefSlug); });
    });
  });
}

init();
</script>
</body>
</html>
